<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>White Club 活動日程排程系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* 自訂滾動條樣式 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 6px;
    }

    .sticky-col {
      position: sticky;
      left: 0;
      z-index: 30;
      background-color: #ffffff;
    }
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .sticky-top-left {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 50;
      background-color: #ffffff;
    }

    .timeline-container {
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    
    .event-card {
      transition: all 0.15s ease-in-out;
    }
    .event-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      z-index: 25 !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-rose-100 selection:text-rose-600">

  <!-- 頂部導航與功能控制列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-[1920px] mx-auto px-3 sm:px-6 py-2 flex flex-wrap items-center justify-between gap-2">
      
      <!-- LOGO 與 標題 -->
      <div class="flex items-center gap-3">
        <img id="header-logo-img" src="white club 深 pink@1200x.png" alt="White Club Logo" class="h-8 sm:h-11 w-auto object-contain" onerror="this.style.display='none'; document.getElementById('svg-logo-fallback').classList.remove('hidden')">
        
        <div id="svg-logo-fallback" class="hidden flex items-center">
          <svg class="h-8 sm:h-11 w-auto" viewBox="0 0 340 90" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 38 6 C 22 34 8 50 8 68 A 30 30 0 0 0 68 68 C 68 50 54 34 38 6 Z" stroke="#c97b75" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="9" y1="58" x2="67" y2="58" stroke="#c97b75" stroke-width="4.5"/>
            <text x="82" y="38" fill="#c97b75" font-family="sans-serif" font-weight="300" font-size="38">White</text>
            <text x="82" y="78" fill="#c97b75" font-family="sans-serif" font-weight="300" font-size="38">Club</text>
          </svg>
        </div>

        <div class="border-l border-slate-200 pl-2 py-0.5">
          <span class="px-2 py-0.5 text-[10px] sm:text-xs font-bold bg-rose-50 text-[#c97b75] rounded-full border border-rose-100">日程管理</span>
        </div>
      </div>

      <!-- 中間：日期控制與「月曆 / 7日視圖」切換 -->
      <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs">
        <button id="btn-prev-period" class="p-1 rounded-lg hover:bg-white text-slate-600 transition" title="前一期">
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </button>
        <button id="btn-today" class="px-2.5 py-1 rounded-lg hover:bg-white font-bold text-slate-700 transition">
          今天
        </button>
        <button id="btn-next-period" class="p-1 rounded-lg hover:bg-white text-slate-600 transition" title="後一期">
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>

        <div class="h-4 w-px bg-slate-300 mx-0.5"></div>

        <!-- 日期選擇器 -->
        <input type="date" id="date-picker-input" class="bg-transparent border-0 text-xs font-bold text-slate-800 focus:ring-0 cursor-pointer p-0 w-28">

        <div class="h-4 w-px bg-slate-300 mx-0.5"></div>

        <!-- 視圖模式切換 (月曆 vs 7日) -->
        <div class="flex bg-slate-200/80 p-0.5 rounded-lg text-[11px] font-bold">
          <button id="view-mode-7day" class="px-2.5 py-1 rounded-md bg-white text-slate-900 shadow-xs transition flex items-center gap-1">
            <i data-lucide="columns" class="w-3.5 h-3.5"></i>
            <span>7 日視圖</span>
          </button>
          <button id="view-mode-month" class="px-2.5 py-1 rounded-md text-slate-600 hover:text-slate-900 transition flex items-center gap-1">
            <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
            <span>月曆檢視</span>
          </button>
        </div>
      </div>

      <!-- 右側：搜尋列與新增按鈕 -->
      <div class="flex items-center gap-2">
        <div class="relative hidden sm:block">
          <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5"></i>
          <input type="text" id="search-bar-input" placeholder="搜尋課程..." class="pl-8 pr-2 py-1 bg-slate-100 focus:bg-white border border-slate-200 rounded-lg text-xs w-28 focus:w-40 transition-all">
        </div>

        <button id="btn-open-create-modal" class="inline-flex items-center gap-1 px-3 py-1.5 bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold rounded-xl shadow-xs transition active:scale-95">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>新增課程</span>
        </button>
      </div>

    </div>
  </header>

  <!-- 主時間軸與月曆滾動區域 -->
  <main class="flex-1 flex flex-col overflow-hidden relative">

    <!-- 頂部日期條 (改為中央置中顯示) -->
    <div class="bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between text-xs text-slate-500">
      <div class="flex-1"></div>
      <div class="flex items-center justify-center gap-2 text-center flex-1">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="current-range-display" class="font-extrabold text-slate-800 text-base tracking-wide">載入中...</span>
      </div>
      <div class="flex items-center justify-end gap-3 text-[11px] flex-1">
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-blue-100 border border-blue-400"></span> 1/F 場地</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-amber-100 border border-amber-400"></span> 2/F 場地</span>
      </div>
    </div>

    <!-- 1. 7 日時間軸表格視窗 -->
    <div id="timeline-view-container" class="flex-1 overflow-x-auto overflow-y-auto timeline-container bg-slate-100">
      <div id="timeline-grid" class="inline-block min-w-full bg-white relative"></div>
    </div>

    <!-- 2. 月曆大格檢視視窗 (文字放大，支援香港公眾假期) -->
    <div id="month-view-container" class="hidden flex-1 overflow-y-auto bg-slate-100 p-2 sm:p-4">
      <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden flex flex-col min-h-[700px]">
        <!-- 星期 Header (字體放大至 text-sm/14px) -->
        <div class="grid grid-cols-7 bg-slate-100 border-b border-slate-200 text-center py-2.5 text-sm font-black text-slate-700">
          <div class="text-rose-600">週日</div><div>週一</div><div>週二</div><div>週三</div><div>週四</div><div>週五</div><div class="text-blue-600">週六</div>
        </div>
        <!-- 月曆方格 Grid -->
        <div id="month-grid" class="grid grid-cols-7 flex-1 auto-rows-fr divide-x divide-y divide-slate-200 bg-slate-200/50"></div>
      </div>
    </div>

  </main>

  <!-- 提示訊息 Toast 容器 -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- ==================== MODAL: 新增/批次規劃課程彈窗 ==================== -->
  <div id="modal-create" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <div class="flex items-center gap-2">
          <div class="p-2 bg-rose-100 text-rose-600 rounded-lg">
            <i data-lucide="calendar-plus" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="text-base font-bold text-slate-900">新增活動課程</h3>
            <p class="text-xs text-slate-500">支援單堂自選時間或多堂自動推算</p>
          </div>
        </div>
        <button class="modal-close-btn text-slate-400 hover:text-slate-600 p-1.5 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="p-6 overflow-y-auto space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">活動 / 課程名稱 *</label>
          <input type="text" id="form-title" placeholder="例如：拆解法老詛咒：木乃伊的永生與禁忌解密" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-semibold" required>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-700 mb-1">分層場地 *</label>
            <select id="form-floor" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-semibold">
              <option value="1/F">1/F</option>
              <option value="2/F">2/F</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">主題顏色</label>
            <div id="create-theme-swatches" class="flex flex-wrap gap-2 pt-1"></div>
          </div>
        </div>

        <div class="border-t border-slate-200 pt-3">
          <div class="flex items-center justify-between mb-2">
            <span class="font-bold text-slate-700">排程模式</span>
            <div class="flex gap-2">
              <label class="inline-flex items-center cursor-pointer">
                <input type="radio" name="plan-mode" value="single" checked class="text-rose-500">
                <span class="ml-1 font-bold">單堂</span>
              </label>
              <label class="inline-flex items-center cursor-pointer ml-2">
                <input type="radio" name="plan-mode" value="batch" class="text-rose-500">
                <span class="ml-1 font-bold">多堂推算</span>
              </label>
            </div>
          </div>

          <div id="section-single-mode" class="space-y-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <div>
                <label class="block text-slate-600 mb-1">日期</label>
                <input type="date" id="single-date" class="w-full px-2 py-1.5 rounded-lg border border-slate-300 font-medium">
              </div>
              <div>
                <label class="block text-slate-600 mb-1">開始</label>
                <input type="time" id="single-start-time" value="19:00" class="w-full px-2 py-1.5 rounded-lg border border-slate-300 font-medium">
              </div>
              <div>
                <label class="block text-slate-600 mb-1">結束</label>
                <input type="time" id="single-end-time" value="20:30" class="w-full px-2 py-1.5 rounded-lg border border-slate-300 font-medium">
              </div>
            </div>
            <div>
              <label class="block text-slate-600 mb-1">堂數備註 (可選)</label>
              <input type="text" id="single-tag" placeholder="例如：單堂體驗 或 第 1 堂" class="w-full px-2 py-1.5 rounded-lg border border-slate-300">
            </div>
          </div>

          <div id="section-batch-mode" class="hidden space-y-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-2 items-end border-b border-slate-200 pb-2">
              <div>
                <label class="block text-slate-600 mb-1">首次開課日期 *</label>
                <input type="date" id="batch-start-date" class="w-full px-2 py-1.5 rounded-lg border border-slate-300 font-medium">
              </div>
              <div>
                <label class="block text-slate-600 mb-1">預設堂數</label>
                <input type="number" id="batch-total-lessons" value="6" min="1" max="30" class="w-full px-2 py-1.5 rounded-lg border border-slate-300 font-medium">
              </div>
              <div>
                <label class="block text-slate-600 mb-1">預設時間</label>
                <div class="flex items-center gap-1">
                  <input type="time" id="batch-start-time" value="19:00" class="w-16 px-1 py-1 rounded border border-slate-300 text-[11px]">
                  <span>-</span>
                  <input type="time" id="batch-end-time" value="20:30" class="w-16 px-1 py-1 rounded border border-slate-300 text-[11px]">
                </div>
              </div>
              <div>
                <button type="button" id="btn-generate-batch-rows" class="w-full py-1.5 px-2 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg transition">
                  自動推算
                </button>
              </div>
            </div>
            <div id="batch-lessons-container" class="space-y-2 max-h-[220px] overflow-y-auto pr-1"></div>
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">簡介 / 備註</label>
          <textarea id="form-description" rows="2" placeholder="詳細內容..." class="w-full px-3 py-2 rounded-xl border border-slate-300"></textarea>
        </div>
      </div>

      <div class="px-6 py-3 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-2">
        <button type="button" class="modal-close-btn px-3 py-1.5 rounded-xl border border-slate-300 text-slate-600 font-semibold">
          取消
        </button>
        <button id="btn-submit-create" type="button" class="px-4 py-1.5 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-bold shadow-xs">
          儲存排程
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript 核心邏輯 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    let currentStartDate = new Date(); 
    let activeMainView = '7day'; 
    let searchQuery = ''; 

    let db = null;
    let auth = null;
    let currentUser = null;

    const firebaseConfig = {
      apiKey: "AIzaSyCoWT-RWzv1-IIvK7xJnG-2MteM41N8r8Y",
      authDomain: "white-club-f67c5.firebaseapp.com",
      projectId: "white-club-f67c5",
      storageBucket: "white-club-f67c5.firebasestorage.app",
      messagingSenderId: "653533908453",
      appId: "1:653533908453:web:9d672931bf70961839330c",
      measurementId: "G-CMJ1FEC3W0"
    };

    // 香港 2026 年法定公眾假期清單 (月曆標記)
    const HK_HOLIDAYS_2026 = {
      "2026-01-01": "元旦",
      "2026-02-17": "農曆年初一",
      "2026-02-18": "農曆年初二",
      "2026-02-19": "農曆年初三",
      "2026-04-03": "耶穌受難節",
      "2026-04-04": "兒童節/清明節",
      "2026-04-06": "復活節清明補假",
      "2026-05-01": "勞動節",
      "2026-05-24": "佛誕",
      "2026-06-19": "端午節",
      "2026-07-01": "特區成立紀念日",
      "2026-09-26": "中秋節翌日",
      "2026-10-01": "國慶日",
      "2026-10-18": "重陽節",
      "2026-12-25": "聖誕節",
      "2026-12-26": "節禮日"
    };

    const PRESET_COLORS = [
      { id: 'emerald', hex: '#10b981', label: '翡翠綠' },
      { id: 'indigo',  hex: '#6366f1', label: '星空藍' },
      { id: 'rose',    hex: '#f43f5e', label: '玫瑰紅' },
      { id: 'amber',   hex: '#f59e0b', label: '暖琥珀' },
      { id: 'purple',  hex: '#a855f7', label: '經典紫' },
      { id: 'sky',     hex: '#0284c7', label: '蔚藍色' },
      { id: 'orange',  hex: '#ea580c', label: '活力橙' },
      { id: 'pink',    hex: '#ec4899', label: '櫻花粉' },
      { id: 'teal',    hex: '#0d9488', label: '深藍綠' },
      { id: 'slate',   hex: '#475569', label: '深石灰' }
    ];

    let selectedCreateColor = '#10b981';

    const initialSeedEvents = [
      { id: 'ev-802', groupKey: 'group-802', title: '尼羅河之法老茶聚時光', date: '2026-08-02', startTime: '13:00', endTime: '15:00', floor: '1/F', themeColor: '#10b981', tag: '茶聚', desc: '一個地方 滿足你一百個願望' },
      { id: 'ev-805', groupKey: 'group-805', title: '人生電量表 Dinner', date: '2026-08-05', startTime: '19:30', endTime: '21:30', floor: '2/F', themeColor: '#f59e0b', tag: 'Dinner', desc: '晚宴聚會' },
      { id: 'ev-818a', groupKey: 'mummy-curse', title: '拆解法老詛咒：木乃伊的永生與禁忌解密', date: '2026-08-18', startTime: '19:00', endTime: '20:30', floor: '1/F', themeColor: '#10b981', tag: '第 1/6 堂', desc: '逢星期二 19:00 - 20:30，共 6 堂' }
    ];

    let eventsData = [...initialSeedEvents];

    async function initRealtimeFirebase() {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        const res = await signInAnonymously(auth);
        currentUser = res.user;

        if (!currentUser) return;

        const eventsColRef = collection(db, 'events');

        onSnapshot(eventsColRef, async (snapshot) => {
          if (snapshot.empty) {
            for (const ev of initialSeedEvents) {
              const { id, ...evData } = ev;
              await setDoc(doc(eventsColRef, id), evData);
            }
            return;
          }

          eventsData = [];
          snapshot.forEach((docSnap) => {
            eventsData.push({
              id: docSnap.id,
              ...docSnap.data()
            });
          });

          renderCurrentView();
        });

      } catch (err) {
        console.error("Firebase Error:", err);
        renderCurrentView();
      }
    }

    const START_HOUR = 10;
    const END_HOUR = 22;
    const PIXELS_PER_MINUTE = 96 / 60;

    function formatDateYMD(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getWeekDayName(d) {
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      return days[d.getDay()];
    }

    function timeToMinutes(timeStr) {
      if (!timeStr) return 0;
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    function renderCurrentView() {
      if (activeMainView === '7day') {
        document.getElementById('timeline-view-container').classList.remove('hidden');
        document.getElementById('month-view-container').classList.add('hidden');
        renderTimeline();
      } else {
        document.getElementById('timeline-view-container').classList.add('hidden');
        document.getElementById('month-view-container').classList.remove('hidden');
        renderMonthCalendar();
      }
    }

    // 1. 渲染 7 日時間軸視圖
    function renderTimeline() {
      const container = document.getElementById('timeline-grid');
      if (!container) return;
      container.innerHTML = '';

      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(currentStartDate);
        d.setDate(d.getDate() + i);
        days.push(d);
      }

      const startStr = formatDateYMD(days[0]);
      const endStr = formatDateYMD(days[6]);

      // 置中標題條文字
      document.getElementById('current-range-display').textContent = `${startStr} 至 ${endStr}`;
      document.getElementById('date-picker-input').value = startStr;

      const floorColWidth = window.innerWidth < 640 ? 'min-w-[140px]' : 'min-w-[200px]';
      const timeColWidth = 'w-14 min-w-[56px]';

      const headerWrapper = document.createElement('div');
      headerWrapper.className = 'sticky-header flex border-b border-slate-200 bg-white';

      const topLeftCorner = document.createElement('div');
      topLeftCorner.className = `${timeColWidth} sticky-top-left border-r border-slate-200 p-1 flex flex-col items-center justify-center bg-slate-50`;
      topLeftCorner.innerHTML = `<span class="text-[9px] font-bold text-slate-400">時間/日期</span>`;
      headerWrapper.appendChild(topLeftCorner);

      days.forEach(day => {
        const ymd = formatDateYMD(day);
        const dayName = getWeekDayName(day);
        const isToday = ymd === formatDateYMD(new Date());

        const dayHeaderCol = document.createElement('div');
        dayHeaderCol.className = 'flex flex-col border-r border-slate-200 bg-slate-50/70';

        const dateTop = document.createElement('div');
        dateTop.className = `p-1.5 text-center border-b border-slate-200 ${isToday ? 'bg-rose-50 text-rose-700' : 'text-slate-800'}`;
        dateTop.innerHTML = `
          <div class="text-[10px] font-semibold ${isToday ? 'text-rose-600 font-black' : 'text-slate-500'}">${dayName}</div>
          <div class="text-xs sm:text-sm font-black">${day.getDate()} <span class="text-[9px] font-normal text-slate-400">${day.getMonth() + 1}月</span></div>
        `;
        dayHeaderCol.appendChild(dateTop);

        const subFloorRow = document.createElement('div');
        subFloorRow.className = 'flex text-[11px] font-bold text-center';
        
        const f1 = document.createElement('div');
        f1.className = `${floorColWidth} py-1 bg-blue-100 text-blue-950 border-r border-blue-200 flex items-center justify-center gap-1 font-black`;
        f1.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-600"></span> 1/F`;
        subFloorRow.appendChild(f1);

        const f2 = document.createElement('div');
        f2.className = `${floorColWidth} py-1 bg-amber-100 text-amber-950 border-r border-amber-200 flex items-center justify-center gap-1 font-black`;
        f2.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-600"></span> 2/F`;
        subFloorRow.appendChild(f2);

        dayHeaderCol.appendChild(subFloorRow);
        headerWrapper.appendChild(dayHeaderCol);
      });

      container.appendChild(headerWrapper);

      const gridBody = document.createElement('div');
      gridBody.className = 'flex relative';

      const timeScaleCol = document.createElement('div');
      timeScaleCol.className = `${timeColWidth} sticky-col border-r border-slate-200 bg-slate-50/90`;

      for (let h = START_HOUR; h < END_HOUR; h++) {
        const timeBlock = document.createElement('div');
        timeBlock.style.height = `${60 * PIXELS_PER_MINUTE}px`;
        timeBlock.className = 'border-b border-slate-200/80 px-1 py-1 text-right';
        timeBlock.innerHTML = `<span class="text-[10px] font-bold text-slate-500">${String(h).padStart(2, '0')}:00</span>`;
        timeScaleCol.appendChild(timeBlock);
      }
      gridBody.appendChild(timeScaleCol);

      days.forEach(day => {
        const ymd = formatDateYMD(day);
        const dayColContainer = document.createElement('div');
        dayColContainer.className = 'flex border-r border-slate-200 relative';

        const col1F = createFloorTimeColumn(ymd, '1/F', floorColWidth);
        dayColContainer.appendChild(col1F);

        const col2F = createFloorTimeColumn(ymd, '2/F', floorColWidth);
        dayColContainer.appendChild(col2F);

        gridBody.appendChild(dayColContainer);
      });

      container.appendChild(gridBody);
      lucide.createIcons();
    }

    function createFloorTimeColumn(ymd, floor, widthClass) {
      const col = document.createElement('div');
      const is1F = floor === '1/F';
      col.className = `${widthClass} relative ${is1F ? 'bg-blue-50/50 border-r border-blue-200/80' : 'bg-amber-50/50 border-r border-amber-200/80'}`;

      const totalHeight = (END_HOUR - START_HOUR) * 60 * PIXELS_PER_MINUTE;
      col.style.height = `${totalHeight}px`;

      const floorEvents = eventsData.filter(e => e.date === ymd && e.floor === floor);

      const eventItems = floorEvents.map(ev => ({
        data: ev,
        startMin: timeToMinutes(ev.startTime),
        endMin: timeToMinutes(ev.endTime)
      })).sort((a, b) => a.startMin - b.startMin);

      const columns = [];
      eventItems.forEach(item => {
        let placed = false;
        for (let colIdx = 0; colIdx < columns.length; colIdx++) {
          const lastItem = columns[colIdx][columns[colIdx].length - 1];
          if (lastItem.endMin <= item.startMin) {
            columns[colIdx].push(item);
            item.colIndex = colIdx;
            placed = true;
            break;
          }
        }
        if (!placed) {
          item.colIndex = columns.length;
          columns.push([item]);
        }
      });

      eventItems.forEach(item => {
        const overlappingInGroup = eventItems.filter(other => !(other.endMin <= item.startMin || other.startMin >= item.endMin));
        const totalCols = Math.max(...overlappingInGroup.map(o => o.colIndex)) + 1;
        const card = createEventCard(item.data, item.colIndex, totalCols);
        col.appendChild(card);
      });

      return col;
    }

    function createEventCard(ev, colIndex = 0, totalCols = 1) {
      const startMin = timeToMinutes(ev.startTime);
      const endMin = timeToMinutes(ev.endTime);
      const top = (startMin - (START_HOUR * 60)) * PIXELS_PER_MINUTE;
      const height = Math.max((endMin - startMin) * PIXELS_PER_MINUTE, 38);
      const color = ev.themeColor || '#10b981';

      const widthPercent = 100 / totalCols;
      const leftPercent = colIndex * widthPercent;

      const card = document.createElement('div');
      card.className = `event-card absolute rounded-lg p-1.5 cursor-pointer border flex flex-col justify-between overflow-hidden`;
      card.style.top = `${top}px`;
      card.style.height = `${height - 3}px`;
      card.style.left = `calc(${leftPercent}% + 1px)`;
      card.style.width = `calc(${widthPercent}% - 2px)`;
      card.style.zIndex = '20';
      card.style.backgroundColor = `${color}18`;
      card.style.borderColor = color;
      card.style.borderLeftWidth = '3px';

      card.innerHTML = `
        <div>
          <div class="flex items-center justify-between gap-0.5 mb-0.5">
            <span class="text-[9px] font-black px-1 rounded text-white" style="background-color: ${color}">${ev.startTime}</span>
            ${ev.tag ? `<span class="text-[8px] font-bold px-0.5 rounded truncate max-w-[50px]" style="background-color: ${color}25; color: ${color}">${ev.tag}</span>` : ''}
          </div>
          <h4 class="text-[11px] font-black line-clamp-2 leading-tight" style="color: ${color}">${ev.title}</h4>
        </div>
      `;
      return card;
    }

    // 2. 渲染月曆大格視圖 (置中、字體放大3-4px、標註香港假期)
    function renderMonthCalendar() {
      const monthGrid = document.getElementById('month-grid');
      if (!monthGrid) return;
      monthGrid.innerHTML = '';

      const year = currentStartDate.getFullYear();
      const month = currentStartDate.getMonth();

      // 中央標題條更新
      document.getElementById('current-range-display').textContent = `${year} 年 ${month + 1} 月份月曆`;

      const firstDayOfMonth = new Date(year, month, 1);
      const lastDayOfMonth = new Date(year, month + 1, 0);

      const startDayOfWeek = firstDayOfMonth.getDay(); 
      const totalDays = lastDayOfMonth.getDate();

      const prevMonthLastDay = new Date(year, month, 0).getDate();

      // 填補上個月尾數
      for (let i = startDayOfWeek - 1; i >= 0; i--) {
        const dayNum = prevMonthLastDay - i;
        const cell = document.createElement('div');
        cell.className = 'bg-slate-50/50 p-2 text-slate-300 text-sm min-h-[110px] select-none';
        cell.innerHTML = `<span class="font-bold">${dayNum}</span>`;
        monthGrid.appendChild(cell);
      }

      // 當月天數
      for (let day = 1; day <= totalDays; day++) {
        const currentDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = currentDateStr === formatDateYMD(new Date());
        const holidayName = HK_HOLIDAYS_2026[currentDateStr] || null;

        const dayEvents = eventsData.filter(e => e.date === currentDateStr);

        const cell = document.createElement('div');
        cell.className = `bg-white p-2 flex flex-col justify-between min-h-[110px] transition hover:bg-slate-50 cursor-pointer ${isToday ? 'ring-2 ring-rose-500 ring-inset bg-rose-50/20' : ''}`;

        let eventsHtml = '';
        dayEvents.forEach(ev => {
          const color = ev.themeColor || '#10b981';
          // 活動文字放大 3px 至 text-xs (12px/13px)
          eventsHtml += `
            <div class="px-2 py-1 rounded text-xs font-bold truncate border flex items-center justify-between gap-1 mb-1 shadow-2xs" style="background-color:${color}15; border-color:${color}40; color:${color}">
              <span class="truncate">${ev.startTime} ${ev.title}</span>
              <span class="text-[10px] shrink-0 font-extrabold px-1 rounded ${ev.floor === '1/F' ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800'}">${ev.floor}</span>
            </div>
          `;
        });

        // 日期數字放大 4px 至 text-base (16px)
        cell.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <div class="flex items-center gap-1.5">
                <span class="text-base font-black ${isToday ? 'w-6 h-6 bg-rose-500 text-white rounded-full flex items-center justify-center text-xs' : (holidayName ? 'text-rose-600 font-black' : 'text-slate-800')}">${day}</span>
                ${holidayName ? `<span class="px-1.5 py-0.2 rounded text-[10px] font-bold bg-rose-100 text-rose-700 border border-rose-200">${holidayName}</span>` : ''}
              </div>
              ${dayEvents.length > 0 ? `<span class="text-xs font-bold px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-600">${dayEvents.length}堂</span>` : ''}
            </div>
            <div class="space-y-1 max-h-[90px] overflow-y-auto">${eventsHtml}</div>
          </div>
        `;

        cell.addEventListener('click', () => {
          currentStartDate = new Date(currentDateStr);
          activeMainView = '7day';
          updateViewButtonsUI();
          renderCurrentView();
        });

        monthGrid.appendChild(cell);
      }

      // 填補下個月天數
      const totalCells = startDayOfWeek + totalDays;
      const nextDays = (7 - (totalCells % 7)) % 7;
      for (let i = 1; i <= nextDays; i++) {
        const cell = document.createElement('div');
        cell.className = 'bg-slate-50/50 p-2 text-slate-300 text-sm min-h-[110px] select-none';
        cell.innerHTML = `<span class="font-bold">${i}</span>`;
        monthGrid.appendChild(cell);
      }
    }

    const btn7Day = document.getElementById('view-mode-7day');
    const btnMonth = document.getElementById('view-mode-month');

    function updateViewButtonsUI() {
      if (activeMainView === '7day') {
        btn7Day.className = 'px-2.5 py-1 rounded-md bg-white text-slate-900 shadow-xs transition flex items-center gap-1';
        btnMonth.className = 'px-2.5 py-1 rounded-md text-slate-600 hover:text-slate-900 transition flex items-center gap-1';
      } else {
        btnMonth.className = 'px-2.5 py-1 rounded-md bg-white text-slate-900 shadow-xs transition flex items-center gap-1';
        btn7Day.className = 'px-2.5 py-1 rounded-md text-slate-600 hover:text-slate-900 transition flex items-center gap-1';
      }
    }

    btn7Day?.addEventListener('click', () => {
      activeMainView = '7day';
      updateViewButtonsUI();
      renderCurrentView();
    });

    btnMonth?.addEventListener('click', () => {
      activeMainView = 'month';
      updateViewButtonsUI();
      renderCurrentView();
    });

    document.getElementById('btn-prev-period')?.addEventListener('click', () => {
      if (activeMainView === '7day') {
        currentStartDate.setDate(currentStartDate.getDate() - 7);
      } else {
        currentStartDate.setMonth(currentStartDate.getMonth() - 1);
      }
      renderCurrentView();
    });

    document.getElementById('btn-next-period')?.addEventListener('click', () => {
      if (activeMainView === '7day') {
        currentStartDate.setDate(currentStartDate.getDate() + 7);
      } else {
        currentStartDate.setMonth(currentStartDate.getMonth() + 1);
      }
      renderCurrentView();
    });

    document.getElementById('btn-today')?.addEventListener('click', () => {
      currentStartDate = new Date();
      renderCurrentView();
    });

    document.getElementById('date-picker-input')?.addEventListener('change', (e) => {
      if (e.target.value) {
        currentStartDate = new Date(e.target.value);
        renderCurrentView();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      initRealtimeFirebase();
    });
  </script>
</body>
