<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>White Club 活動日程排程系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* 自訂滾動條樣式 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 6px;
    }

    .sticky-col {
      position: sticky;
      left: 0;
      z-index: 30;
      background-color: #ffffff;
    }
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .sticky-top-left {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 50;
      background-color: #ffffff;
    }

    .timeline-container {
      scroll-behavior: smooth;
    }
    
    .event-card {
      transition: all 0.15s ease-in-out;
    }
    .event-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      z-index: 25 !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-rose-100 selection:text-rose-600">

  <!-- 頂部導航與功能控制列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-[1920px] mx-auto px-3 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-2.5">
      
      <!-- LOGO 與 標題 -->
      <div class="flex items-center gap-3">
        <img id="header-logo-img" src="white club 深 pink@1200x.png" alt="White Club Logo" class="h-9 sm:h-11 w-auto object-contain" onerror="this.style.display='none'; document.getElementById('svg-logo-fallback').classList.remove('hidden')">
        
        <div id="svg-logo-fallback" class="hidden flex items-center">
          <svg class="h-9 sm:h-11 w-auto" viewBox="0 0 340 90" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 38 6 C 22 34 8 50 8 68 A 30 30 0 0 0 68 68 C 68 50 54 34 38 6 Z" stroke="#c97b75" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="9" y1="58" x2="67" y2="58" stroke="#c97b75" stroke-width="4.5"/>
            <text x="82" y="38" fill="#c97b75" font-family="sans-serif" font-weight="300" font-size="38">White</text>
            <text x="82" y="78" fill="#c97b75" font-family="sans-serif" font-weight="300" font-size="38">Club</text>
          </svg>
        </div>

        <div class="border-l border-slate-200 pl-2.5 py-0.5">
          <span class="px-2 py-0.5 text-[11px] font-bold bg-rose-50 text-[#c97b75] rounded-full border border-rose-100">日程管理</span>
        </div>
      </div>

      <!-- 中間：裝置檢視模式切換 (PC vs Phone 模式切換) -->
      <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl border border-slate-200">
        <!-- PC vs Phone 主模式切換 -->
        <div class="flex bg-slate-200/80 p-0.5 rounded-lg text-xs font-bold">
          <button id="device-pc-mode" class="px-2.5 py-1 rounded-md bg-white text-slate-900 shadow-xs transition flex items-center gap-1">
            <i data-lucide="monitor" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">PC 模式</span>
          </button>
          <button id="device-phone-mode" class="px-2.5 py-1 rounded-md text-slate-600 hover:text-slate-900 transition flex items-center gap-1">
            <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">Phone 模式</span>
          </button>
        </div>

        <div class="h-4 w-px bg-slate-300 mx-0.5"></div>

        <!-- 快速跳轉控制 -->
        <button id="btn-prev-week" class="p-1 rounded-lg hover:bg-white text-slate-600 hover:text-slate-900 transition">
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </button>
        <button id="btn-today" class="px-2.5 py-1 rounded-lg hover:bg-white text-xs font-bold text-slate-700 transition">
          今天
        </button>
        <button id="btn-next-week" class="p-1 rounded-lg hover:bg-white text-slate-600 hover:text-slate-900 transition">
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>

        <div class="h-4 w-px bg-slate-300 mx-0.5"></div>

        <!-- 日期選擇器 -->
        <input type="date" id="date-picker-input" class="bg-transparent border-0 text-xs font-bold text-slate-800 focus:ring-0 cursor-pointer p-0 w-28">
      </div>

      <!-- 右側：功能按鈕組 -->
      <div class="flex items-center gap-2">
        <!-- 搜尋列 -->
        <div class="relative hidden md:block">
          <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5"></i>
          <input type="text" id="search-bar-input" placeholder="搜尋..." class="pl-8 pr-2.5 py-1 bg-slate-100 focus:bg-white border border-slate-200 rounded-lg text-xs w-32 focus:w-48 transition-all">
        </div>

        <!-- 新增活動按鈕 -->
        <button id="btn-open-create-modal" class="inline-flex items-center gap-1 px-3 py-1.5 bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold rounded-xl shadow-xs transition transform active:scale-95">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>新增</span>
        </button>
      </div>

    </div>
  </header>

  <!-- 主時間軸滾動區域 -->
  <main class="flex-1 flex flex-col overflow-hidden relative">

    <!-- 頂部日期條 -->
    <div class="bg-white border-b border-slate-200 px-4 py-1.5 flex items-center justify-between text-xs text-slate-500">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="current-range-display" class="font-bold text-slate-700">載入中...</span>
      </div>
      <div class="flex items-center gap-3 text-[11px]">
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-blue-100 border border-blue-400"></span> 1/F</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-amber-100 border border-amber-400"></span> 2/F</span>
      </div>
    </div>

    <!-- 表格主要視窗 (PC 視圖網格) -->
    <div id="pc-view-container" class="flex-1 overflow-x-auto overflow-y-auto timeline-container bg-slate-100">
      <div id="timeline-grid" class="inline-block min-w-full bg-white relative"></div>
    </div>

    <!-- Phone 模式專屬直向列表視窗 (Phone View Layout) -->
    <div id="phone-view-container" class="hidden flex-1 overflow-y-auto bg-slate-50 p-3 space-y-4 max-w-md mx-auto w-full">
      <!-- JS 動態渲染 iPhone 直向列表卡片 -->
    </div>

  </main>

  <!-- 提示訊息 Toast 容器 -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- ==================== MODAL: 新增/批次規劃課程彈窗 ==================== -->
  <div id="modal-create" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden">
      
      <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <div class="flex items-center gap-2">
          <div class="p-2 bg-rose-100 text-rose-600 rounded-lg">
            <i data-lucide="calendar-plus" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="text-base font-bold text-slate-900">新增活動課程</h3>
            <p class="text-xs text-slate-500">單堂自選時間或多堂自動推算</p>
          </div>
        </div>
        <button class="modal-close-btn text-slate-400 hover:text-slate-600 p-1.5 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="p-6 overflow-y-auto space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">活動 / 課程名稱 *</label>
          <input type="text" id="form-title" placeholder="例如：拆解法老詛咒：木乃伊的永生與禁忌解密" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-semibold" required>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-700 mb-1">分層場地 *</label>
            <select id="form-floor" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-semibold">
              <option value="1/F">1/F</option>
              <option value="2/F">2/F</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">主題顏色</label>
            <div id="create-theme-swatches" class="flex flex-wrap gap-2 pt-1"></div>
          </div>
        </div>

        <div class="border-t border-slate-200 pt-3">
          <div class="flex items-center justify-between mb-2">
            <span class="font-bold text-slate-700">排程模式</span>
            <div class="flex gap-2">
              <label class="inline-flex items-center cursor-pointer">
                <input type="radio" name="plan-mode" value="single" checked class="text-rose-500">
                <span class="ml-1 font-bold">單堂</span>
              </label>
              <label class="inline-flex items-center cursor-pointer ml-2">
                <input type="radio" name="plan-mode" value="batch" class="text-rose-500">
                <span class="ml-1 font-bold">多堂推算</span>
              </label>
            </div>
          </div>

          <!-- 單堂模式 -->
          <div id="section-single-mode" class="space-y-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <div>
                <label class="block text-slate-600 mb-1">日期</label>
                <input type="date" id="single-date" class="w-full px-2 py-1.5 rounded-lg border border-slate-300 font-medium">
              </div>
              <div>
                <label class="block text-slate-600 mb-1">開始</label>
                <input type="time" id="single-start-time" value="19:00" class="w-full px-2 py-1.5 rounded-lg border border-slate-300 font-medium">
              </div>
              <div>
                <label class="block text-slate-600 mb-1">結束</label>
                <input type="time" id="single-end-time" value="20:30" class="w-full px-2 py-1.5 rounded-lg border border-slate-300 font-medium">
              </div>
            </div>
            <div>
              <label class="block text-slate-600 mb-1">堂數備註 (可選)</label>
              <input type="text" id="single-tag" placeholder="例如：單堂體驗 或 第 1 堂" class="w-full px-2 py-1.5 rounded-lg border border-slate-300">
            </div>
          </div>

          <!-- 批次模式 -->
          <div id="section-batch-mode" class="hidden space-y-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-2 items-end border-b border-slate-200 pb-2">
              <div>
                <label class="block text-slate-600 mb-1">首次開課日期 *</label>
                <input type="date" id="batch-start-date" class="w-full px-2 py-1.5 rounded-lg border border-slate-300 font-medium">
              </div>
              <div>
                <label class="block text-slate-600 mb-1">預設堂數</label>
                <input type="number" id="batch-total-lessons" value="6" min="1" max="30" class="w-full px-2 py-1.5 rounded-lg border border-slate-300 font-medium">
              </div>
              <div>
                <label class="block text-slate-600 mb-1">預設時間</label>
                <div class="flex items-center gap-1">
                  <input type="time" id="batch-start-time" value="19:00" class="w-16 px-1 py-1 rounded border border-slate-300 text-[11px]">
                  <span>-</span>
                  <input type="time" id="batch-end-time" value="20:30" class="w-16 px-1 py-1 rounded border border-slate-300 text-[11px]">
                </div>
              </div>
              <div>
                <button type="button" id="btn-generate-batch-rows" class="w-full py-1.5 px-2 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg transition">
                  自動推算
                </button>
              </div>
            </div>

            <div id="batch-lessons-container" class="space-y-2 max-h-[220px] overflow-y-auto pr-1"></div>
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">簡介 / 備註</label>
          <textarea id="form-description" rows="2" placeholder="詳細內容..." class="w-full px-3 py-2 rounded-xl border border-slate-300"></textarea>
        </div>

      </div>

      <div class="px-6 py-3 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-2">
        <button type="button" class="modal-close-btn px-3 py-1.5 rounded-xl border border-slate-300 text-slate-600 font-semibold">
          取消
        </button>
        <button id="btn-submit-create" type="button" class="px-4 py-1.5 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-bold shadow-xs">
          儲存排程
        </button>
      </div>

    </div>
  </div>

  <!-- ==================== MODAL: 撞期二次確認彈窗 ==================== -->
  <div id="modal-conflict-warning" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-5 text-center space-y-3">
      <div class="w-10 h-10 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto">
        <i data-lucide="alert-triangle" class="w-5 h-5"></i>
      </div>
      <div>
        <h3 class="text-sm font-bold text-slate-900">偵測到場地時間撞期！</h3>
        <p id="conflict-warning-msg" class="text-xs text-slate-600 mt-2 bg-amber-50 p-2.5 rounded-xl border border-amber-200 text-left font-medium leading-relaxed"></p>
        <p class="text-xs font-bold text-slate-500 mt-2">此場地該時段已有其他課程，是否依然增加？</p>
      </div>
      <div class="flex items-center justify-center gap-2 pt-1">
        <button id="btn-cancel-conflict" type="button" class="w-full py-2 rounded-xl border border-slate-300 text-slate-700 text-xs font-bold">
          否，返回修改
        </button>
        <button id="btn-confirm-conflict" type="button" class="w-full py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold">
          是，依然增加
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript 核心邏輯 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    let currentStartDate = new Date(); 
    let activeDeviceMode = window.innerWidth < 768 ? 'phone' : 'pc'; // 自動判斷預設模式
    let activeFloorFilter = 'ALL'; 
    let searchQuery = ''; 

    let db = null;
    let auth = null;
    let currentUser = null;

    const firebaseConfig = {
      apiKey: "AIzaSyCoWT-RWzv1-IIvK7xJnG-2MteM41N8r8Y",
      authDomain: "white-club-f67c5.firebaseapp.com",
      projectId: "white-club-f67c5",
      storageBucket: "white-club-f67c5.firebasestorage.app",
      messagingSenderId: "653533908453",
      appId: "1:653533908453:web:9d672931bf70961839330c",
      measurementId: "G-CMJ1FEC3W0"
    };

    const PRESET_COLORS = [
      { id: 'emerald', hex: '#10b981', label: '翡翠綠' },
      { id: 'indigo',  hex: '#6366f1', label: '星空藍' },
      { id: 'rose',    hex: '#f43f5e', label: '玫瑰紅' },
      { id: 'amber',   hex: '#f59e0b', label: '暖琥珀' },
      { id: 'purple',  hex: '#a855f7', label: '經典紫' },
      { id: 'sky',     hex: '#0284c7', label: '蔚藍色' },
      { id: 'orange',  hex: '#ea580c', label: '活力橙' },
      { id: 'pink',    hex: '#ec4899', label: '櫻花粉' },
      { id: 'teal',    hex: '#0d9488', label: '深藍綠' },
      { id: 'slate',   hex: '#475569', label: '深石灰' }
    ];

    let selectedCreateColor = '#10b981';

    const initialSeedEvents = [
      { id: 'ev-802', groupKey: 'group-802', title: '尼羅河之法老茶聚時光', date: '2026-08-02', startTime: '13:00', endTime: '15:00', floor: '1/F', themeColor: '#10b981', tag: '茶聚', desc: '一個地方 滿足你一百個願望' },
      { id: 'ev-805', groupKey: 'group-805', title: '人生電量表 Dinner', date: '2026-08-05', startTime: '19:30', endTime: '21:30', floor: '2/F', themeColor: '#f59e0b', tag: 'Dinner', desc: '晚宴聚會' },
      { id: 'ev-818a', groupKey: 'mummy-curse', title: '拆解法老詛咒：木乃伊的永生與禁忌解密', date: '2026-08-18', startTime: '19:00', endTime: '20:30', floor: '1/F', themeColor: '#10b981', tag: '第 1/6 堂', desc: '逢星期二 19:00 - 20:30，共 6 堂' }
    ];

    let eventsData = [...initialSeedEvents];

    async function initRealtimeFirebase() {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        const res = await signInAnonymously(auth);
        currentUser = res.user;

        if (!currentUser) return;

        const eventsColRef = collection(db, 'events');

        onSnapshot(eventsColRef, async (snapshot) => {
          if (snapshot.empty) {
            for (const ev of initialSeedEvents) {
              const { id, ...evData } = ev;
              await setDoc(doc(eventsColRef, id), evData);
            }
            return;
          }

          eventsData = [];
          snapshot.forEach((docSnap) => {
            eventsData.push({
              id: docSnap.id,
              ...docSnap.data()
            });
          });

          renderView();
        });

      } catch (err) {
        console.error("Firebase Error:", err);
        renderView();
      }
    }

    const START_HOUR = 10;
    const END_HOUR = 22;
    const PIXELS_PER_MINUTE = 96 / 60;

    function formatDateYMD(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getWeekDayName(d) {
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      return days[d.getDay()];
    }

    function timeToMinutes(timeStr) {
      if (!timeStr) return 0;
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    function renderView() {
      if (activeDeviceMode === 'pc') {
        document.getElementById('pc-view-container').classList.remove('hidden');
        document.getElementById('phone-view-container').classList.add('hidden');
        renderPCRimeline();
      } else {
        document.getElementById('pc-view-container').classList.add('hidden');
        document.getElementById('phone-view-container').classList.remove('hidden');
        renderPhoneList();
      }
    }

    // 渲染 PC 模式 (網格視圖)
    function renderPCRimeline() {
      const container = document.getElementById('timeline-grid');
      if (!container) return;
      container.innerHTML = '';

      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(currentStartDate);
        d.setDate(d.getDate() + i);
        days.push(d);
      }

      const startStr = formatDateYMD(days[0]);
      const endStr = formatDateYMD(days[6]);
      document.getElementById('current-range-display').textContent = `${startStr} 至 ${endStr} (PC 表格模式)`;
      document.getElementById('date-picker-input').value = startStr;

      const floorColWidth = 'min-w-[210px] sm:min-w-[240px]';
      const timeColWidth = 'w-16 min-w-[64px]';

      const headerWrapper = document.createElement('div');
      headerWrapper.className = 'sticky-header flex border-b border-slate-200 bg-white';

      const topLeftCorner = document.createElement('div');
      topLeftCorner.className = `${timeColWidth} sticky-top-left border-r border-slate-200 p-2 flex flex-col items-center justify-center bg-slate-50`;
      topLeftCorner.innerHTML = `<span class="text-[10px] font-bold text-slate-400">時間/日期</span>`;
      headerWrapper.appendChild(topLeftCorner);

      days.forEach(day => {
        const ymd = formatDateYMD(day);
        const dayName = getWeekDayName(day);
        const isToday = ymd === formatDateYMD(new Date());

        const dayHeaderCol = document.createElement('div');
        dayHeaderCol.className = 'flex flex-col border-r border-slate-200 bg-slate-50/70';

        const dateTop = document.createElement('div');
        dateTop.className = `p-2 text-center border-b border-slate-200 ${isToday ? 'bg-rose-50 text-rose-700' : 'text-slate-800'}`;
        dateTop.innerHTML = `
          <div class="text-[11px] font-semibold ${isToday ? 'text-rose-600 font-black' : 'text-slate-500'}">${dayName}</div>
          <div class="text-sm font-black">${day.getDate()} <span class="text-[10px] font-normal text-slate-400">${day.getMonth() + 1}月</span></div>
        `;
        dayHeaderCol.appendChild(dateTop);

        const subFloorRow = document.createElement('div');
        subFloorRow.className = 'flex text-xs font-bold text-center';
        
        const f1 = document.createElement('div');
        f1.className = `${floorColWidth} py-1 bg-blue-100 text-blue-950 border-r border-blue-200 flex items-center justify-center gap-1 font-black`;
        f1.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-600"></span> 1/F`;
        subFloorRow.appendChild(f1);

        const f2 = document.createElement('div');
        f2.className = `${floorColWidth} py-1 bg-amber-100 text-amber-950 border-r border-amber-200 flex items-center justify-center gap-1 font-black`;
        f2.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-600"></span> 2/F`;
        subFloorRow.appendChild(f2);

        dayHeaderCol.appendChild(subFloorRow);
        headerWrapper.appendChild(dayHeaderCol);
      });

      container.appendChild(headerWrapper);

      const gridBody = document.createElement('div');
      gridBody.className = 'flex relative';

      const timeScaleCol = document.createElement('div');
      timeScaleCol.className = `${timeColWidth} sticky-col border-r border-slate-200 bg-slate-50/90`;

      for (let h = START_HOUR; h < END_HOUR; h++) {
        const timeBlock = document.createElement('div');
        timeBlock.style.height = `${60 * PIXELS_PER_MINUTE}px`;
        timeBlock.className = 'border-b border-slate-200/80 px-1 py-1 text-right';
        timeBlock.innerHTML = `<span class="text-[10px] font-bold text-slate-500">${String(h).padStart(2, '0')}:00</span>`;
        timeScaleCol.appendChild(timeBlock);
      }
      gridBody.appendChild(timeScaleCol);

      days.forEach(day => {
        const ymd = formatDateYMD(day);
        const dayColContainer = document.createElement('div');
        dayColContainer.className = 'flex border-r border-slate-200 relative';

        const col1F = createFloorTimeColumn(ymd, '1/F', floorColWidth);
        dayColContainer.appendChild(col1F);

        const col2F = createFloorTimeColumn(ymd, '2/F', floorColWidth);
        dayColContainer.appendChild(col2F);

        gridBody.appendChild(dayColContainer);
      });

      container.appendChild(gridBody);
      lucide.createIcons();
    }

    function createFloorTimeColumn(ymd, floor, widthClass) {
      const col = document.createElement('div');
      const is1F = floor === '1/F';
      col.className = `${widthClass} relative ${is1F ? 'bg-blue-50/50 border-r border-blue-200/80' : 'bg-amber-50/50 border-r border-amber-200/80'}`;

      const totalHeight = (END_HOUR - START_HOUR) * 60 * PIXELS_PER_MINUTE;
      col.style.height = `${totalHeight}px`;

      const floorEvents = eventsData.filter(e => e.date === ymd && e.floor === floor);

      const eventItems = floorEvents.map(ev => ({
        data: ev,
        startMin: timeToMinutes(ev.startTime),
        endMin: timeToMinutes(ev.endTime)
      })).sort((a, b) => a.startMin - b.startMin);

      const columns = [];
      eventItems.forEach(item => {
        let placed = false;
        for (let colIdx = 0; colIdx < columns.length; colIdx++) {
          const lastItem = columns[colIdx][columns[colIdx].length - 1];
          if (lastItem.endMin <= item.startMin) {
            columns[colIdx].push(item);
            item.colIndex = colIdx;
            placed = true;
            break;
          }
        }
        if (!placed) {
          item.colIndex = columns.length;
          columns.push([item]);
        }
      });

      eventItems.forEach(item => {
        const overlappingInGroup = eventItems.filter(other => !(other.endMin <= item.startMin || other.startMin >= item.endMin));
        const totalCols = Math.max(...overlappingInGroup.map(o => o.colIndex)) + 1;
        const card = createEventCard(item.data, item.colIndex, totalCols);
        col.appendChild(card);
      });

      return col;
    }

    function createEventCard(ev, colIndex = 0, totalCols = 1) {
      const startMin = timeToMinutes(ev.startTime);
      const endMin = timeToMinutes(ev.endTime);
      const top = (startMin - (START_HOUR * 60)) * PIXELS_PER_MINUTE;
      const height = Math.max((endMin - startMin) * PIXELS_PER_MINUTE, 40);
      const color = ev.themeColor || '#10b981';

      const widthPercent = 100 / totalCols;
      const leftPercent = colIndex * widthPercent;

      const card = document.createElement('div');
      card.className = `event-card absolute rounded-xl p-2 cursor-pointer border flex flex-col justify-between overflow-hidden`;
      card.style.top = `${top}px`;
      card.style.height = `${height - 4}px`;
      card.style.left = `calc(${leftPercent}% + 2px)`;
      card.style.width = `calc(${widthPercent}% - 4px)`;
      card.style.zIndex = '20';
      card.style.backgroundColor = `${color}18`;
      card.style.borderColor = color;
      card.style.borderLeftWidth = '4px';

      card.innerHTML = `
        <div>
          <div class="flex items-center justify-between gap-1 mb-0.5">
            <span class="text-[10px] font-black px-1 rounded text-white" style="background-color: ${color}">${ev.startTime} - ${ev.endTime}</span>
            ${ev.tag ? `<span class="text-[9px] font-bold px-1 rounded truncate max-w-[60px]" style="background-color: ${color}25; color: ${color}">${ev.tag}</span>` : ''}
          </div>
          <h4 class="text-xs font-black line-clamp-2 leading-tight" style="color: ${color}">${ev.title}</h4>
        </div>
      `;
      return card;
    }

    // 渲染 Phone 模式 (專為 iPhone 高長螢幕設計的直向流式卡片)
    function renderPhoneList() {
      const container = document.getElementById('phone-view-container');
      if (!container) return;
      container.innerHTML = '';

      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(currentStartDate);
        d.setDate(d.getDate() + i);
        days.push(d);
      }

      const startStr = formatDateYMD(days[0]);
      document.getElementById('current-range-display').textContent = `${startStr} (Phone 專屬單向直視圖)`;

      days.forEach(day => {
        const ymd = formatDateYMD(day);
        const dayName = getWeekDayName(day);
        const dayEvents = eventsData.filter(e => e.date === ymd);

        const dayBlock = document.createElement('div');
        dayBlock.className = 'bg-white rounded-2xl p-3.5 shadow-xs border border-slate-200/80 space-y-2.5';

        const isToday = ymd === formatDateYMD(new Date());
        dayBlock.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-100 pb-2">
            <div class="flex items-center gap-2">
              <span class="text-sm font-black ${isToday ? 'text-rose-600' : 'text-slate-800'}">${ymd} (${dayName})</span>
              ${isToday ? '<span class="px-2 py-0.5 text-[10px] font-bold bg-rose-50 text-rose-600 rounded-full border border-rose-100">今日</span>' : ''}
            </div>
            <span class="text-xs font-bold text-slate-400">${dayEvents.length} 個活動</span>
          </div>
        `;

        if (dayEvents.length === 0) {
          dayBlock.innerHTML += `<div class="text-xs text-slate-400 py-2 text-center font-medium">無排定活動</div>`;
        } else {
          const listWrapper = document.createElement('div');
          listWrapper.className = 'space-y-2';

          dayEvents.forEach(ev => {
            const color = ev.themeColor || '#10b981';
            const is1F = ev.floor === '1/F';

            const card = document.createElement('div');
            card.className = 'p-3 rounded-xl border flex flex-col gap-1.5 transition active:scale-[0.99] cursor-pointer';
            card.style.backgroundColor = `${color}10`;
            card.style.borderColor = `${color}40`;
            card.style.borderLeftWidth = '5px';
            card.style.borderLeftColor = color;

            card.innerHTML = `
              <div class="flex items-center justify-between gap-2">
                <span class="px-2 py-0.5 rounded text-xs font-black text-white" style="background-color: ${color}">
                  ${ev.startTime} - ${ev.endTime}
                </span>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${is1F ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800'}">
                  📍 ${ev.floor}
                </span>
              </div>
              <h4 class="text-sm font-black text-slate-800 leading-snug">${ev.title}</h4>
              ${ev.desc ? `<p class="text-xs text-slate-500 line-clamp-2">${ev.desc}</p>` : ''}
            `;
            listWrapper.appendChild(card);
          });
          dayBlock.appendChild(listWrapper);
        }

        container.appendChild(dayBlock);
      });
    }

    // 裝置模式切換 (PC vs Phone)
    document.getElementById('device-pc-mode')?.addEventListener('click', () => {
      activeDeviceMode = 'pc';
      document.getElementById('device-pc-mode').className = 'px-2.5 py-1 rounded-md bg-white text-slate-900 shadow-xs transition flex items-center gap-1';
      document.getElementById('device-phone-mode').className = 'px-2.5 py-1 rounded-md text-slate-600 hover:text-slate-900 transition flex items-center gap-1';
      renderView();
    });

    document.getElementById('device-phone-mode')?.addEventListener('click', () => {
      activeDeviceMode = 'phone';
      document.getElementById('device-phone-mode').className = 'px-2.5 py-1 rounded-md bg-white text-slate-900 shadow-xs transition flex items-center gap-1';
      document.getElementById('device-pc-mode').className = 'px-2.5 py-1 rounded-md text-slate-600 hover:text-slate-900 transition flex items-center gap-1';
      renderView();
    });

    document.getElementById('btn-prev-week')?.addEventListener('click', () => {
      currentStartDate.setDate(currentStartDate.getDate() - 7);
      renderView();
    });

    document.getElementById('btn-next-week')?.addEventListener('click', () => {
      currentStartDate.setDate(currentStartDate.getDate() + 7);
      renderView();
    });

    document.getElementById('btn-today')?.addEventListener('click', () => {
      currentStartDate = new Date();
      renderView();
    });

    document.getElementById('date-picker-input')?.addEventListener('change', (e) => {
      if (e.target.value) {
        currentStartDate = new Date(e.target.value);
        renderView();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      initRealtimeFirebase();
    });
  </script>
</body>
</html>
