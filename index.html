<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>White Club 活動日程排程系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* 自訂滾動條樣式 - 方便 PC 左右拖曳 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 12px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 6px;
      border: 2px solid #f1f5f9;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .sticky-col {
      position: sticky;
      left: 0;
      z-index: 30;
      background-color: #ffffff;
    }
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .sticky-top-left {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 50;
      background-color: #ffffff;
    }

    .timeline-container {
      scroll-behavior: smooth;
    }
    
    .event-card {
      transition: all 0.15s ease-in-out;
    }
    .event-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      z-index: 25 !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- 頂部導航與功能控制列 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-[1920px] mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      
      <!-- LOGO 與 標題 -->
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-3">
          <!-- 核心 LOGO 區域 (靜態清爽顯示) -->
          <div class="flex items-center">
            <img id="header-logo-img" src="white club 深 pink@1200x.png" alt="White Club Logo" class="h-10 sm:h-12 w-auto object-contain" onerror="this.style.display='none'; document.getElementById('svg-logo-fallback').classList.remove('hidden')">
            
            <div id="svg-logo-fallback" class="hidden flex items-center">
              <svg class="h-10 sm:h-12 w-auto" viewBox="0 0 340 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M 38 6 C 22 34 8 50 8 68 A 30 30 0 0 0 68 68 C 68 50 54 34 38 6 Z" stroke="#c97b75" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="9" y1="58" x2="67" y2="58" stroke="#c97b75" stroke-width="4.5"/>
                <text x="82" y="38" fill="#c97b75" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="300" font-size="38" letter-spacing="1">White</text>
                <text x="82" y="78" fill="#c97b75" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="300" font-size="38" letter-spacing="1">Club</text>
              </svg>
            </div>
          </div>

          <div class="border-l border-slate-200 pl-3 py-0.5">
            <div class="flex items-center gap-2">
              <span class="px-2.5 py-0.5 text-xs font-bold bg-rose-50 text-[#c97b75] rounded-full border border-rose-100">日程管理</span>
            </div>
            <p class="text-xs text-slate-500 hidden sm:block mt-0.5">一個地方 滿足你一百個願望 · 活動時間表</p>
          </div>
        </div>
      </div>

      <!-- 中間：日期切換與檢視模式切換 -->
      <div class="flex items-center gap-2 bg-slate-100 p-1 rounded-xl border border-slate-200">
        <!-- 快速跳轉 -->
        <button id="btn-prev-week" class="p-1.5 rounded-lg hover:bg-white text-slate-600 hover:text-slate-900 transition" title="前一週 / 前3天">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <button id="btn-today" class="px-3 py-1 rounded-lg hover:bg-white text-xs font-bold text-slate-700 transition">
          今天
        </button>
        <button id="btn-next-week" class="p-1.5 rounded-lg hover:bg-white text-slate-600 hover:text-slate-900 transition" title="後一週 / 後3天">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>

        <div class="h-4 w-px bg-slate-300 mx-1"></div>

        <!-- 日期選擇器 -->
        <div class="flex items-center gap-1 text-sm font-semibold text-slate-800 px-2">
          <i data-lucide="calendar-days" class="w-4 h-4 text-slate-500"></i>
          <input type="date" id="date-picker-input" class="bg-transparent border-0 text-sm font-bold text-slate-800 focus:ring-0 cursor-pointer p-0 w-32">
        </div>

        <div class="h-4 w-px bg-slate-300 mx-1"></div>

        <!-- 視圖切換 (3日 vs 7日) -->
        <div class="flex bg-slate-200/80 p-0.5 rounded-lg text-xs font-medium">
          <button id="view-mode-3day" class="px-2.5 py-1 rounded-md bg-white text-slate-900 shadow-sm font-bold transition">
            3 日清晰
          </button>
          <button id="view-mode-7day" class="px-2.5 py-1 rounded-md text-slate-600 hover:text-slate-900 transition">
            7 日全覽
          </button>
        </div>
      </div>

      <!-- 右側：搜尋列、場地篩選與新增活動按鈕 -->
      <div class="flex items-center gap-3">
        <!-- 關鍵字搜尋列 -->
        <div class="relative hidden sm:block">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
          <input type="text" id="search-bar-input" placeholder="搜尋課程/關鍵字..." class="pl-9 pr-3 py-1.5 bg-slate-100 hover:bg-white focus:bg-white border border-slate-200 rounded-xl text-xs font-medium w-40 focus:w-56 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-rose-400">
        </div>

        <div id="sync-status-badge" class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-bold border border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="sync-status-text">雲端即時同步中</span>
        </div>

        <!-- 場地快速 Filter -->
        <div class="hidden lg:flex items-center gap-1 bg-slate-100 p-1 rounded-lg text-xs font-medium border border-slate-200">
          <span class="text-slate-400 px-2 text-[11px]">場地:</span>
          <button class="filter-floor-btn px-2 py-1 rounded bg-white text-slate-800 shadow-xs font-bold" data-floor="ALL">全部</button>
          <button class="filter-floor-btn px-2 py-1 rounded text-blue-700 hover:bg-white/60" data-floor="1/F">1/F 只睇</button>
          <button class="filter-floor-btn px-2 py-1 rounded text-amber-700 hover:bg-white/60" data-floor="2/F">2/F 只睇</button>
        </div>

        <!-- 新增活動 -->
        <button id="btn-open-create-modal" class="inline-flex items-center gap-1.5 px-4 py-2 bg-gradient-to-r from-rose-500 to-orange-500 hover:from-rose-600 hover:to-orange-600 text-white text-sm font-bold rounded-xl shadow-md shadow-orange-500/20 transition transform active:scale-95">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span>新增 / 規劃課程</span>
        </button>
      </div>

    </div>
  </header>

  <!-- 主時間軸滾動區域 -->
  <main class="flex-1 flex flex-col overflow-hidden relative">

    <!-- 頂部目前日期範圍提示條 -->
    <div class="bg-white border-b border-slate-200 px-6 py-2 flex items-center justify-between text-xs text-slate-500">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="current-range-display" class="font-bold text-slate-700 text-sm">載入中...</span>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-1.5">
          <span class="w-3.5 h-3.5 rounded bg-blue-100 border border-blue-300 inline-block shadow-xs"></span>
          <span class="font-bold text-blue-900">1/F 場地 (藍色區)</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3.5 h-3.5 rounded bg-amber-100 border border-amber-300 inline-block shadow-xs"></span>
          <span class="font-bold text-amber-900">2/F 場地 (黃色區)</span>
        </div>
      </div>
    </div>

    <!-- 表格主要滾動視窗 -->
    <div id="timeline-scroll-container" class="flex-1 overflow-x-auto overflow-y-auto timeline-container bg-slate-100">
      <div id="timeline-grid" class="inline-block min-w-full bg-white relative">
        <!-- JS 動態生成 日期雙層 Header 與 網格 -->
      </div>
    </div>
  </main>

  <!-- 提示訊息 Toast 容器 -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- ==================== MODAL: 新增/批次規劃課程彈窗 ==================== -->
  <div id="modal-create" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in duration-150">
      
      <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <div class="flex items-center gap-2">
          <div class="p-2 bg-rose-100 text-rose-600 rounded-lg">
            <i data-lucide="calendar-plus" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="text-lg font-bold text-slate-900">新增或規劃活動課程</h3>
            <p class="text-xs text-slate-500">支援單堂自選時間或多堂自動推算</p>
          </div>
        </div>
        <button class="modal-close-btn text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-100">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="p-6 overflow-y-auto space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">活動 / 課程名稱 *</label>
          <input type="text" id="form-title" placeholder="例如：拆解法老詛咒：木乃伊的永生與禁忌解密" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm font-semibold" required>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">分層場地 *</label>
            <select id="form-floor" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-rose-500 text-sm font-semibold">
              <option value="1/F">1/F</option>
              <option value="2/F">2/F</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">主題顏色</label>
            <div id="create-theme-swatches" class="flex flex-wrap gap-2 pt-1"></div>
          </div>
        </div>

        <div class="border-t border-slate-200 pt-4">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-bold text-slate-700 uppercase tracking-wider">排程模式</span>
            <div class="flex gap-2">
              <label class="inline-flex items-center text-xs cursor-pointer">
                <input type="radio" name="plan-mode" value="single" checked class="text-rose-500 focus:ring-rose-400">
                <span class="ml-1.5 font-bold text-slate-700">單獨自選時間 (單堂)</span>
              </label>
              <label class="inline-flex items-center text-xs cursor-pointer ml-3">
                <input type="radio" name="plan-mode" value="batch" class="text-rose-500 focus:ring-rose-400">
                <span class="ml-1.5 font-bold text-slate-700">自動批次推算 (多堂)</span>
              </label>
            </div>
          </div>

          <!-- 單堂模式 -->
          <div id="section-single-mode" class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">開課日期</label>
                <input type="date" id="single-date" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm font-medium">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">開始時間</label>
                <input type="time" id="single-start-time" value="19:00" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm font-medium">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">結束時間</label>
                <input type="time" id="single-end-time" value="20:30" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm font-medium">
              </div>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">堂數備註 (可選)</label>
              <input type="text" id="single-tag" placeholder="例如：單堂體驗 或 第 1 堂" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
            </div>
          </div>

          <!-- 批次模式 -->
          <div id="section-batch-mode" class="hidden space-y-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 items-end border-b border-slate-200 pb-3">
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">首次開課日期 *</label>
                <input type="date" id="batch-start-date" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm font-medium">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">預設堂數</label>
                <input type="number" id="batch-total-lessons" value="6" min="1" max="30" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm font-medium">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">預設時間</label>
                <div class="flex items-center gap-1">
                  <input type="time" id="batch-start-time" value="19:00" class="w-20 px-2 py-2 rounded-lg border border-slate-300 text-xs font-medium">
                  <span class="text-xs text-slate-400">-</span>
                  <input type="time" id="batch-end-time" value="20:30" class="w-20 px-2 py-2 rounded-lg border border-slate-300 text-xs font-medium">
                </div>
              </div>
              <div>
                <button type="button" id="btn-generate-batch-rows" class="w-full py-2 px-3 bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold rounded-lg transition flex items-center justify-center gap-1">
                  <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                  <span>自動推算堂數</span>
                </button>
              </div>
            </div>

            <div>
              <div class="flex items-center justify-between mb-2">
                <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">多堂自選清單</label>
                <button type="button" id="btn-add-batch-row" class="text-xs text-rose-600 hover:text-rose-700 font-bold inline-flex items-center gap-1 bg-rose-50 px-2.5 py-1 rounded-md border border-rose-100">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                  <span>+ 手動加一堂</span>
                </button>
              </div>
              <div id="batch-lessons-container" class="space-y-2.5 max-h-[280px] overflow-y-auto pr-1"></div>
            </div>
          </div>

        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">課程簡介 / 備註</label>
          <textarea id="form-description" rows="2" placeholder="詳細內容或備註事項..." class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm"></textarea>
        </div>

      </div>

      <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-3">
        <button type="button" class="modal-close-btn px-4 py-2 rounded-xl border border-slate-300 text-slate-600 text-sm font-semibold hover:bg-slate-100">
          取消
        </button>
        <button id="btn-submit-create" type="button" class="px-5 py-2 rounded-xl bg-rose-500 hover:bg-rose-600 text-white text-sm font-bold shadow-md shadow-rose-500/20">
          確認儲存排程
        </button>
      </div>

    </div>
  </div>

  <!-- ==================== MODAL: 撞期二次確認彈窗 ==================== -->
  <div id="modal-conflict-warning" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 text-center space-y-4 animate-in fade-in zoom-in duration-150">
      <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto">
        <i data-lucide="alert-triangle" class="w-6 h-6"></i>
      </div>
      <div>
        <h3 class="text-base font-bold text-slate-900">偵測到場地時間撞期！</h3>
        <p id="conflict-warning-msg" class="text-xs text-slate-600 mt-2 bg-amber-50 p-3 rounded-xl border border-amber-200 text-left font-medium leading-relaxed"></p>
        <p class="text-xs font-bold text-slate-500 mt-2">此場地該時段已有其他課程，是否依然增加？</p>
      </div>
      <div class="flex items-center justify-center gap-3 pt-2">
        <button id="btn-cancel-conflict" type="button" class="w-full py-2.5 rounded-xl border border-slate-300 text-slate-700 text-xs font-bold hover:bg-slate-100">
          否，返回修改
        </button>
        <button id="btn-confirm-conflict" type="button" class="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold shadow-md shadow-amber-500/20">
          是，依然增加
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== MODAL: 編輯全系列課程詳情彈窗 ==================== -->
  <div id="modal-edit" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full max-h-[92vh] flex flex-col overflow-hidden animate-in fade-in zoom-in duration-150">
      
      <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <div class="flex items-center gap-2">
          <div class="p-2 bg-blue-100 text-blue-600 rounded-lg">
            <i data-lucide="layers" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="text-lg font-bold text-slate-900">編輯全系列課程詳情</h3>
            <p class="text-xs text-slate-500">一次過檢視並修改全套所有堂數的時間與名稱</p>
          </div>
        </div>
        <button class="modal-edit-close-btn text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-100">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="p-6 overflow-y-auto space-y-5">
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">主課程名稱 *</label>
            <input type="text" id="edit-group-title" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 text-sm font-bold">
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">分層場地 *</label>
              <select id="edit-group-floor" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm font-semibold">
                <option value="1/F">1/F</option>
                <option value="2/F">2/F</option>
              </select>
            </div>
            <div>
              <div class="flex items-center justify-between mb-1">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">主題顏色 * (點選預覽或自訂調色)</label>
                <span id="edit-color-hex-display" class="text-[10px] font-mono font-bold text-slate-400">#10b981</span>
              </div>
              <div id="edit-theme-swatches" class="flex flex-wrap gap-2 pt-1"></div>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">簡介說明</label>
            <input type="text" id="edit-group-desc" placeholder="例如：每堂 1.5 小時，共 6 堂" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm">
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
              <i data-lucide="list-checks" class="w-4 h-4 text-blue-600"></i>
              <span>全套所有堂數清單 (<span id="edit-series-count">0</span> 堂)</span>
            </span>
            <button type="button" id="btn-edit-add-lesson" class="text-xs text-blue-600 hover:text-blue-700 font-bold inline-flex items-center gap-1 bg-blue-50 px-2.5 py-1 rounded-md border border-blue-100">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span>+ 增加一堂</span>
            </button>
          </div>

          <div id="edit-series-lessons-container" class="space-y-2.5 max-h-[340px] overflow-y-auto pr-1"></div>
        </div>
      </div>

    let eventsData = [...initialSeedEvents];

    async function initRealtimeFirebase() {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        const res = await signInAnonymously(auth);
        currentUser = res.user;

        if (!currentUser) return;

        const eventsColRef = collection(db, 'events');

        onSnapshot(eventsColRef, async (snapshot) => {
          if (snapshot.empty) {
            for (const ev of initialSeedEvents) {
              const { id, ...evData } = ev;
              await setDoc(doc(eventsColRef, id), evData);
            }
            return;
          }

          eventsData = [];
          snapshot.forEach((docSnap) => {
            eventsData.push({
              id: docSnap.id,
              ...docSnap.data()
            });
          });

          renderTimeline();
        });

      } catch (err) {
        console.error("Firebase Initialization Error:", err);
        renderTimeline();
      }
    }

    const START_HOUR = 10;
    const END_HOUR = 22;
    const PIXELS_PER_MINUTE = 96 / 60;

    function formatDateYMD(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getWeekDayName(d) {
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      return days[d.getDay()];
    }

    function timeToMinutes(timeStr) {
      if (!timeStr) return 0;
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    function checkConflict(date, floor, startTime, endTime, excludeDocId = null) {
      const newStart = timeToMinutes(startTime);
      const newEnd = timeToMinutes(endTime);

      return eventsData.find(ev => {
        if (ev.date !== date || ev.floor !== floor) return false;
        if (excludeDocId && ev.id === excludeDocId) return false;

        const evStart = timeToMinutes(ev.startTime);
        const evEnd = timeToMinutes(ev.endTime);

        return (newStart < evEnd && newEnd > evStart);
      });
    }

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      const bg = type === 'success' ? 'bg-slate-900 text-white' : 'bg-red-600 text-white';
      toast.className = `${bg} px-4 py-3 rounded-xl shadow-lg text-sm font-semibold flex items-center gap-2 transform transition-all duration-300 pointer-events-auto`;
      toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-4 h-4"></i><span>${message}</span>`;
      document.getElementById('toast-container').appendChild(toast);
      lucide.createIcons();
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function renderTimeline() {
      const container = document.getElementById('timeline-grid');
      if (!container) return;
      container.innerHTML = '';

      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(currentStartDate);
        d.setDate(d.getDate() + i);
        days.push(d);
      }

      const startStr = formatDateYMD(days[0]);
      const endStr = formatDateYMD(days[6]);
      document.getElementById('current-range-display').textContent = `${startStr} 至 ${endStr} (${viewMode === '3day' ? '預設 3 日視圖，可向右滑動' : '7 日全覽視圖'})`;
      document.getElementById('date-picker-input').value = startStr;

      const floorColWidth = viewMode === '3day' ? 'min-w-[210px] sm:min-w-[240px]' : 'min-w-[150px] sm:min-w-[180px]';
      const timeColWidth = 'w-20 min-w-[80px]';

      const headerWrapper = document.createElement('div');
      headerWrapper.className = 'sticky-header flex border-b border-slate-200 bg-white';

      const topLeftCorner = document.createElement('div');
      topLeftCorner.className = `${timeColWidth} sticky-top-left border-r border-slate-200 p-2 flex flex-col items-center justify-center bg-slate-50`;
      topLeftCorner.innerHTML = `<span class="text-[11px] font-bold text-slate-400 uppercase">時間 / 日期</span>`;
      headerWrapper.appendChild(topLeftCorner);

      days.forEach(day => {
        const ymd = formatDateYMD(day);
        const dayName = getWeekDayName(day);
        const isToday = ymd === formatDateYMD(new Date());

        const dayHeaderCol = document.createElement('div');
        dayHeaderCol.className = 'flex flex-col border-r border-slate-200 bg-slate-50/70';

        const dateTop = document.createElement('div');
        dateTop.className = `p-2.5 text-center border-b border-slate-200 ${isToday ? 'bg-rose-50/80 text-rose-700' : 'text-slate-800'}`;
        dateTop.innerHTML = `
          <div class="text-xs font-semibold ${isToday ? 'text-rose-600 font-black' : 'text-slate-500'}">${dayName}</div>
          <div class="text-base font-black tracking-tight">${day.getDate()} <span class="text-xs font-bold text-slate-400">${day.getMonth() + 1}月</span></div>
        `;
        dayHeaderCol.appendChild(dateTop);

        const subFloorRow = document.createElement('div');
        subFloorRow.className = 'flex text-xs font-bold text-center';
        
        if (activeFloorFilter === 'ALL' || activeFloorFilter === '1/F') {
          const f1 = document.createElement('div');
          f1.className = `${floorColWidth} py-1.5 bg-blue-100 text-blue-950 border-r border-blue-200 flex items-center justify-center gap-1 font-black shadow-xs`;
          f1.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span> 1/F`;
          subFloorRow.appendChild(f1);
        }

        if (activeFloorFilter === 'ALL' || activeFloorFilter === '2/F') {
          const f2 = document.createElement('div');
          f2.className = `${floorColWidth} py-1.5 bg-amber-100 text-amber-950 border-r border-amber-200 flex items-center justify-center gap-1 font-black shadow-xs`;
          f2.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-amber-600"></span> 2/F`;
          subFloorRow.appendChild(f2);
        }

        dayHeaderCol.appendChild(subFloorRow);
        headerWrapper.appendChild(dayHeaderCol);
      });

      container.appendChild(headerWrapper);

      const gridBody = document.createElement('div');
      gridBody.className = 'flex relative';

      const timeScaleCol = document.createElement('div');
      timeScaleCol.className = `${timeColWidth} sticky-col border-r border-slate-200 select-none bg-slate-50/90`;

      for (let h = START_HOUR; h < END_HOUR; h++) {
        const timeBlock = document.createElement('div');
        timeBlock.style.height = `${60 * PIXELS_PER_MINUTE}px`;
        timeBlock.className = 'border-b border-slate-200/80 px-2 py-1 text-right';
        const formattedHour = `${String(h).padStart(2, '0')}:00`;
        timeBlock.innerHTML = `<span class="text-xs font-bold text-slate-500">${formattedHour}</span>`;
        timeScaleCol.appendChild(timeBlock);
      }
      gridBody.appendChild(timeScaleCol);

      days.forEach(day => {
        const ymd = formatDateYMD(day);
        const dayColContainer = document.createElement('div');
        dayColContainer.className = 'flex border-r border-slate-200 relative';

        if (activeFloorFilter === 'ALL' || activeFloorFilter === '1/F') {
          const col1F = createFloorTimeColumn(ymd, '1/F', floorColWidth);
          dayColContainer.appendChild(col1F);
        }

        if (activeFloorFilter === 'ALL' || activeFloorFilter === '2/F') {
          const col2F = createFloorTimeColumn(ymd, '2/F', floorColWidth);
          dayColContainer.appendChild(col2F);
        }

        gridBody.appendChild(dayColContainer);
      });

      container.appendChild(gridBody);
      lucide.createIcons();
    }

    // 核心升級：自動計算撞期活動並對分寬度左右並排 (Auto Layout Overlapping Events)
    function createFloorTimeColumn(ymd, floor, widthClass) {
      const col = document.createElement('div');
      const is1F = floor === '1/F';
      const colBg = is1F ? 'bg-blue-50/70' : 'bg-amber-50/70';
      const colBorder = is1F ? 'border-r border-blue-200/80' : 'border-r border-amber-200/80';

      col.className = `${widthClass} relative ${colBg} ${colBorder} last:border-r-0`;
      col.setAttribute('data-date', ymd);
      col.setAttribute('data-floor', floor);

      const totalHeight = (END_HOUR - START_HOUR) * 60 * PIXELS_PER_MINUTE;
      col.style.height = `${totalHeight}px`;

      const lineBorder = is1F ? 'border-b border-blue-100/80' : 'border-b border-amber-100/80';
      const hoverBg = is1F ? 'hover:bg-blue-100/60' : 'hover:bg-amber-100/60';
      for (let h = START_HOUR; h < END_HOUR; h++) {
        const line = document.createElement('div');
        line.style.height = `${60 * PIXELS_PER_MINUTE}px`;
        line.className = `${lineBorder} ${hoverBg} transition`;
        col.appendChild(line);
      }

      const floorEvents = eventsData.filter(e => {
        const matchesFloor = (e.date === ymd && e.floor === floor);
        if (!matchesFloor) return false;

        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchTitle = e.title && e.title.toLowerCase().includes(q);
          const matchDesc = e.desc && e.desc.toLowerCase().includes(q);
          const matchTag = e.tag && e.tag.toLowerCase().includes(q);
          return matchTitle || matchDesc || matchTag;
        }
        return true;
      });

      // 步驟 1：計算每張卡片的時間範圍（分鐘）
      const eventItems = floorEvents.map(ev => ({
        data: ev,
        startMin: timeToMinutes(ev.startTime),
        endMin: timeToMinutes(ev.endTime)
      })).sort((a, b) => a.startMin - b.startMin || b.endMin - a.endMin);

      // 步驟 2：計算撞期分欄 (Columns Layout)
      const columns = [];
      eventItems.forEach(item => {
        let placed = false;
        for (let colIdx = 0; colIdx < columns.length; colIdx++) {
          const lastItem = columns[colIdx][columns[colIdx].length - 1];
          if (lastItem.endMin <= item.startMin) {
            columns[colIdx].push(item);
            item.colIndex = colIdx;
            placed = true;
            break;
          }
        }
        if (!placed) {
          item.colIndex = columns.length;
          columns.push([item]);
        }
      });

      // 步驟 3：渲染卡片並設定獨立寬度與左右位移
      eventItems.forEach(item => {
        // 計算與當前卡片在時間上重疊的總欄數
        const overlappingInGroup = eventItems.filter(other => 
          !(other.endMin <= item.startMin || other.startMin >= item.endMin)
        );
        const totalCols = Math.max(...overlappingInGroup.map(o => o.colIndex)) + 1;

        const card = createEventCard(item.data, item.colIndex, totalCols);
        col.appendChild(card);
      });

      return col;
    }

    function createEventCard(ev, colIndex = 0, totalCols = 1) {
      const startMin = timeToMinutes(ev.startTime);
      const endMin = timeToMinutes(ev.endTime);
      const baseStartMin = START_HOUR * 60;

      const top = (startMin - baseStartMin) * PIXELS_PER_MINUTE;
      const height = Math.max((endMin - startMin) * PIXELS_PER_MINUTE, 42);

      const color = ev.themeColor || '#10b981';

      // 寬度與邊距動態對分計算
      const widthPercent = 100 / totalCols;
      const leftPercent = colIndex * widthPercent;

      const card = document.createElement('div');
      card.className = `event-card absolute rounded-xl p-2 cursor-pointer shadow-xs border flex flex-col justify-between overflow-hidden`;
      card.style.top = `${top}px`;
      card.style.height = `${height - 4}px`;
      card.style.left = `calc(${leftPercent}% + 2px)`;
      card.style.width = `calc(${widthPercent}% - 4px)`;
      card.style.zIndex = '20';
      card.style.backgroundColor = `${color}18`;
      card.style.borderColor = color;
      card.style.borderLeftWidth = '4px';

      card.innerHTML = `
        <div>
          <div class="flex flex-wrap items-center justify-between gap-0.5 mb-0.5">
            <span class="text-[10px] sm:text-[11px] font-black tracking-tight px-1 py-0.2 rounded text-white" style="background-color: ${color}">
              ${ev.startTime} - ${ev.endTime}
            </span>
            ${ev.tag ? `<span class="text-[9px] font-bold px-1 py-0.2 rounded truncate max-w-[65px]" style="background-color: ${color}25; color: ${color}">${ev.tag}</span>` : ''}
          </div>
          <h4 class="text-xs font-black line-clamp-2 leading-tight" style="color: ${color}">
            ${ev.title}
          </h4>
        </div>
        ${ev.desc && height > 75 ? `<p class="text-[10px] text-slate-500 truncate mt-0.5">${ev.desc}</p>` : ''}
      `;

      card.addEventListener('click', (e) => {
        e.stopPropagation();
        openSeriesEditModal(ev);
      });

      return card;
    }

        const desc = document.getElementById('form-description').value.trim();
        const mode = document.querySelector('input[name="plan-mode"]:checked').value;

        if (!title && mode === 'single') {
          showToast('請輸入活動/課程名稱！', 'error');
          return;
        }

        const groupKey = 'group-' + Date.now();
        const queue = [];
        let conflictEvent = null;

        if (mode === 'single') {
          const date = document.getElementById('single-date').value;
          const startTime = document.getElementById('single-start-time').value;
          const endTime = document.getElementById('single-end-time').value;
          const tag = document.getElementById('single-tag').value.trim() || '單堂';

          if (!date || !startTime || !endTime) {
            showToast('請完整填寫日期與時間！', 'error');
            return;
          }

          conflictEvent = checkConflict(date, floor, startTime, endTime);
          queue.push({ groupKey, title, floor, themeColor: selectedCreateColor, desc, date, startTime, endTime, tag });

        } else {
          if (batchDraftRows.length === 0) {
            showToast('請至少保留或新增一堂課程！', 'error');
            return;
          }

          for (let idx = 0; idx < batchDraftRows.length; idx++) {
            const row = batchDraftRows[idx];
            if (row.title && row.date && row.startTime && row.endTime) {
              const itemObj = {
                groupKey: groupKey,
                title: row.title,
                floor: floor,
                themeColor: selectedCreateColor,
                desc: desc,
                date: row.date,
                startTime: row.startTime,
                endTime: row.endTime,
                tag: row.tag || `第 ${idx + 1}/${batchDraftRows.length} 堂`
              };

              if (!conflictEvent) {
                conflictEvent = checkConflict(row.date, floor, row.startTime, row.endTime);
              }
              queue.push(itemObj);
            }
          }
        }

        if (conflictEvent) {
          pendingCreateQueue = queue;
          document.getElementById('conflict-warning-msg').innerHTML = `
            <strong>撞期日期：</strong>${conflictEvent.date}<br>
            <strong>撞期場地：</strong>${conflictEvent.floor}<br>

          `;
          document.getElementById('modal-conflict-warning').classList.remove('hidden');
        } else {
          await executeSaveQueue(queue);
        }

      } catch (err) {
        console.error("Create submit error:", err);
        document.getElementById('modal-create').classList.add('hidden');

      if (e.target.value) {
        currentStartDate = new Date(e.target.value);
        renderTimeline();
      }
    });

    document.getElementById('search-bar-input')?.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderTimeline();
    });

    const btn3Day = document.getElementById('view-mode-3day');
    const btn7Day = document.getElementById('view-mode-7day');

    btn3Day?.addEventListener('click', () => {
      viewMode = '3day';
      btn3Day.className = 'px-2.5 py-1 rounded-md bg-white text-slate-900 shadow-sm font-bold transition';
      btn7Day.className = 'px-2.5 py-1 rounded-md text-slate-600 hover:text-slate-900 transition';
      renderTimeline();
    });

    btn7Day?.addEventListener('click', () => {
      viewMode = '7day';
      btn7Day.className = 'px-2.5 py-1 rounded-md bg-white text-slate-900 shadow-sm font-bold transition';
      btn3Day.className = 'px-2.5 py-1 rounded-md text-slate-600 hover:text-slate-900 transition';
      renderTimeline();
    });

    document.querySelectorAll('.filter-floor-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-floor-btn').forEach(b => {
          b.className = 'filter-floor-btn px-2 py-1 rounded text-slate-600 hover:bg-white/60';
        });
        e.target.className = 'filter-floor-btn px-2 py-1 rounded bg-white text-slate-900 shadow-xs font-bold';
        activeFloorFilter = e.target.getAttribute('data-floor');
        renderTimeline();
      });
    });

    const scrollContainer = document.getElementById('timeline-scroll-container');
    if (scrollContainer) {
      scrollContainer.addEventListener('wheel', (e) => {
        if (e.deltaX !== 0 || e.shiftKey) {
          scrollContainer.scrollLeft += (e.deltaX || e.deltaY);
        }
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initRealtimeFirebase();
    });
  </script>
</body>
</html>
